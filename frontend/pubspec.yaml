name: lifesync
description: "LifeSync - Your all-in-one personal & family management app. Track finances, tasks, health, shopping, savings goals, and more in one beautiful app."
publish_to: 'none'

version: 3.2.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # UI & Icons
  cupertino_icons: ^1.0.8
  google_fonts: ^6.1.0
  smooth_page_indicator: ^1.2.0

  # State Management
  provider: ^6.1.1

  # Local Storage (for preferences only)
  shared_preferences: ^2.5.4

  # HTTP Client for API calls
  http: ^1.2.0

  # Appwrite for database operations
  appwrite: ^14.0.0


  # Date & Time
  intl: ^0.19.0

  # Charts & Visualization
  fl_chart: ^0.66.0

  # Icons
  font_awesome_flutter: ^10.7.0

  # Utilities
  uuid: ^4.2.2

  # Notifications
  flutter_local_notifications: ^19.5.0
  timezone: ^0.10.1

  # File Picker for health record images


  



  # AI & Analytics
  google_generative_ai: ^0.2.2
  syncfusion_flutter_gauges: ^27.1.48
  shimmer: ^3.0.0
  flutter_markdown: ^0.7.7+1
  permission_handler: ^12.0.1
  flutter_contacts: ^1.1.9+2
  url_launcher: ^6.3.1
  local_auth: 2.2.0
  file_picker: ^10.3.10
  package_info_plus: ^8.3.1
  dio: ^5.9.2
  path_provider: ^2.1.5
  open_filex: ^4.7.0

dependency_overrides:
  flutter_web_auth_2: ^5.0.1
  flutter_web_auth_2_platform_interface: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter:

  uses-material-design: true

  # Assets
  assets:
    - assets/logo.png

# Flutter Launcher Icons Configuration
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/logo.png"
    background_color: "#6C63FF"
    theme_color: "#6C63FF"
  windows:
    generate: true
    image_path: "assets/logo.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/logo.png"
